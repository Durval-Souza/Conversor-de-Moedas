<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Document</title>
</head>
<body>
    <img class="logo-image" src="./assets/logo.gif" alt="logo-convert-money">

    <main>
        <label> Converter <b>de</b>
            <select class="currency-select-to-convert">
                <option value="Real">R$ Real Brasileiro</option>
                <option value="Dolar">US$ Dolar Americano</option>
                <option value="Euro">€ Euro</option>
                <option value="Libra">£ Libra</option>
                <option value="Bitcoin">Bitcoin</option>
            </select>
        </label>

        <label>Converter <b>para</b>
            <select class="currency-select-converted">
                <option value="Real">R$ Real Brasileiro</option>
                <option value="Dolar">US$ Dolar Americano</option>
                <option value="Euro">€ Euro</option>
                <option value="Libra">£ Libra</option>
                <option value="Bitcoin">Bitcoin</option>
            </select>
        </label>

        <label>valor
            <input class="input-currency" placeholder=" 10.000">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img class="currency-img-to-convert" src="./assets/Real.png" alt="currency-img-to-convert">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

            <img class="arrow-img" src="./assets/Arrow.png" alt="seta">

            <div class="currency-box">
                <img class="currency-converted-img" src="./assets/Real.png" alt="logo-moeda-convertida">
                <p class="currency-converted-name">Real</p>
                <p class="currency-value">R$ 0,00</p>
            </div>
        </section>
    </main>
</body>
<script src="./script.js"></script>
</html>
